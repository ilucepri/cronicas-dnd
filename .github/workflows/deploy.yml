name: Construir y desplegar

# Se ejecuta:
#  - push a main (cuando cambias el código de la web)
#  - manualmente desde la pestaña Actions
#  - cuando chaotic-garden avisa de que has publicado (repository_dispatch)
#  - cada 3 horas, como red de seguridad por si el aviso no llega
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [notes-updated]
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la web
        uses: actions/checkout@v4

      - name: Clonar las notas publicadas (chaotic-garden)
        run: git clone --depth 1 https://github.com/ilucepri/chaotic-garden.git chaotic-garden

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Importar notas (modo Digital Garden)
        run: npm run import
        env:
          SOURCE: dg
          VAULT_DIR: chaotic-garden

      - name: Build
        run: npm run build

      - name: Desplegar en Firebase Hosting
        run: npx firebase-tools@13 deploy --only hosting --project cronicas-dnd --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
