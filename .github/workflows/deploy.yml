name: Construir y desplegar

# Se ejecuta:
#  - push a main (cuando cambias el código de la web)
#  - manualmente desde la pestaña Actions
#  - cuando chaotic-garden avisa de que has publicado (repository_dispatch)
#  - cada 3 horas, como red de seguridad por si el aviso no llega
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [notes-updated]
  schedule:
    - cron: '0 */3 * * *'

# Permisos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la web
        uses: actions/checkout@v4

      - name: Clonar las notas publicadas (chaotic-garden)
        run: git clone --depth 1 https://github.com/ilucepri/chaotic-garden.git chaotic-garden

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Importar notas (modo Digital Garden)
        run: npm run import
        env:
          SOURCE: dg
          VAULT_DIR: chaotic-garden

      - name: Build
        run: npm run build
        env:
          # Base para GitHub Pages de proyecto. Si publicas en un dominio raíz
          # (Netlify/Cloudflare/dominio propio), pon VITE_BASE=/ o bórralo.
          VITE_BASE: /cronicas-dnd/

      - name: Fallback SPA para GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
